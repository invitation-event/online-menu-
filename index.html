<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CELAVI — Luxury Café & Bistro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Added Noto Sans/Serif Armenian for beautiful, native Armenian typography -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700;900&family=Montserrat:wght@300;400;500;600&family=Noto+Sans+Armenian:wght@300;400;500;600&family=Noto+Serif+Armenian:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---------- RESET & BASE ---------- */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Montserrat', 'Noto Sans Armenian', sans-serif;
    background: #0e0e0e;
    color: #f5f1ea;
    overflow-x: hidden;
    line-height: 1.6;
  }
  :root {
    --gold: #c9a961;
    --gold-light: #e6cc8a;
    --gold-dark: #8b7355;
    --cream: #f5f1ea;
    --dark: #0e0e0e;
    --dark-soft: #1a1a1a;
    --muted: #9a928a;
  }

  /* ---------- SCROLLBAR ---------- */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #0e0e0e; }
  ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }

  /* ---------- NAVIGATION ---------- */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 1.5rem 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 1000;
    transition: all 0.4s ease;
    background: transparent;
  }
  nav.scrolled {
    background: rgba(14, 14, 14, 0.95);
    backdrop-filter: blur(12px);
    padding: 1rem 5%;
    border-bottom: 1px solid rgba(201, 169, 97, 0.2);
  }
  .logo {
    font-family: 'Playfair Display', 'Noto Serif Armenian', serif;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 6px;
    color: var(--cream);
    text-decoration: none;
  }
  .logo span { color: var(--gold); }
  .nav-links {
    display: flex;
    gap: 2.5rem;
    list-style: none;
    align-items: center;
  }
  .nav-links a {
    color: var(--cream);
    text-decoration: none;
    font-size: 0.85rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 400;
    position: relative;
    transition: color 0.3s;
  }
  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -6px; left: 0;
    width: 0; height: 1px;
    background: var(--gold);
    transition: width 0.4s ease;
  }
  .nav-links a:hover { color: var(--gold); }
  .nav-links a:hover::after { width: 100%; }

  .lang-toggle {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 0.4rem 1rem;
    font-family: 'Montserrat', 'Noto Sans Armenian', sans-serif;
    font-size: 0.8rem;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.3s ease;
    border-radius: 2px;
  }
  .lang-toggle:hover {
    background: var(--gold);
    color: var(--dark);
  }

  .menu-toggle {
    display: none;
    background: none;
    border: none;
    color: var(--cream);
    font-size: 1.5rem;
    cursor: pointer;
  }

  /* ---------- HERO ---------- */
  .hero {
    height: 100vh;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    background:
      linear-gradient(rgba(14,14,14,0.55), rgba(14,14,14,0.75)),
      url('https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?w=1920&q=80') center/cover no-repeat;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, transparent 0%, rgba(14,14,14,0.6) 100%);
  }
  .hero-content {
    position: relative;
    z-index: 2;
    animation: fadeUp 1.5s ease;
  }
  .hero-subtitle {
    font-family: 'Montserrat', 'Noto Sans Armenian', sans-serif;
    font-size: 0.9rem;
    letter-spacing: 8px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 1.5rem;
  }
  .hero-title {
    font-family: 'Playfair Display', 'Noto Serif Armenian', serif;
    font-size: clamp(3rem, 9vw, 7rem);
    font-weight: 700;
    letter-spacing: 12px;
    margin-bottom: 1rem;
    background: linear-gradient(135deg, var(--cream) 0%, var(--gold) 50%, var(--cream) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero-tagline {
    font-family: 'Cormorant Garamond', 'Noto Serif Armenian', serif;
    font-size: 1.5rem;
    font-style: italic;
    color: var(--cream);
    margin-bottom: 3rem;
    opacity: 0.9;
  }
  .hero-divider {
    width: 80px;
    height: 1px;
    background: var(--gold);
    margin: 0 auto 2rem;
    position: relative;
  }
  .hero-divider::before {
    content: '✦';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: var(--gold);
    background: transparent;
    padding: 0 10px;
    font-size: 0.8rem;
  }
  .btn {
    display: inline-block;
    padding: 1rem 2.5rem;
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold);
    text-decoration: none;
    letter-spacing: 3px;
    font-size: 0.85rem;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.4s ease;
    position: relative;
    overflow: hidden;
  }
  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--gold);
    transform: translateY(100%);
    transition: transform 0.4s ease;
    z-index: -1;
  }
  .btn:hover { color: var(--dark); }
  .btn:hover::before { transform: translateY(0); }

  .scroll-indicator {
    position: absolute;
    bottom: 2rem; left: 50%;
    transform: translateX(-50%);
    color: var(--gold);
    font-size: 0.75rem;
    letter-spacing: 3px;
    animation: bounce 2s infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, 10px); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- SECTION COMMON ---------- */
  section { padding: 7rem 5%; }
  .section-header {
    text-align: center;
    margin-bottom: 4rem;
  }
  .section-label {
    font-size: 0.8rem;
    letter-spacing: 6px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 1rem;
  }
  .section-title {
    font-family: 'Playfair Display', 'Noto Serif Armenian', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 600;
    color: var(--cream);
    margin-bottom: 1rem;
  }
  .section-divider {
    width: 60px;
    height: 1px;
    background: var(--gold);
    margin: 1.5rem auto;
  }
  .section-desc {
    max-width: 600px;
    margin: 0 auto;
    color: var(--muted);
    font-style: italic;
    font-family: 'Cormorant Garamond', 'Noto Serif Armenian', serif;
    font-size: 1.2rem;
  }

  /* ---------- MENU SECTION ---------- */
  #menu { background: var(--dark-soft); }
  .menu-categories {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 4rem;
  }
  .category-btn {
    padding: 0.8rem 2rem;
    background: transparent;
    color: var(--cream);
    border: 1px solid rgba(201, 169, 97, 0.3);
    cursor: pointer;
    letter-spacing: 2px;
    font-size: 0.8rem;
    text-transform: uppercase;
    transition: all 0.3s ease;
    font-family: 'Montserrat', 'Noto Sans Armenian', sans-serif;
  }
  .category-btn:hover,
  .category-btn.active {
    background: var(--gold);
    color: var(--dark);
    border-color: var(--gold);
  }

  .menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 2rem;
    max-width: 1300px;
    margin: 0 auto;
  }
  .menu-item {
    background: linear-gradient(145deg, #1e1e1e, #151515);
    border: 1px solid rgba(201, 169, 97, 0.15);
    padding: 2rem;
    border-radius: 4px;
    transition: all 0.5s ease;
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: translateY(30px);
  }
  .menu-item.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .menu-item::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    transition: left 0.6s ease;
  }
  .menu-item:hover {
    transform: translateY(-8px);
    border-color: var(--gold);
    box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 30px rgba(201, 169, 97, 0.1);
  }
  .menu-item:hover::before { left: 100%; }

  .item-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.8rem;
    gap: 1rem;
  }
  .item-name {
    font-family: 'Playfair Display', 'Noto Serif Armenian', serif;
    font-size: 1.3rem;
    color: var(--cream);
    font-weight: 500;
  }
  .item-price {
    color: var(--gold);
    font-weight: 600;
    font-size: 1.1rem;
    white-space: nowrap;
  }
  .item-dots {
    flex: 1;
    border-bottom: 1px dotted rgba(201, 169, 97, 0.3);
    margin-bottom: 5px;
  }
  .item-desc {
    color: var(--muted);
    font-size: 0.9rem;
    font-style: italic;
    font-family: 'Cormorant Garamond', 'Noto Serif Armenian', serif;
    font-size: 1.05rem;
  }
  .item-tags {
    margin-top: 1rem;
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .tag {
    font-size: 0.65rem;
    padding: 0.25rem 0.7rem;
    background: rgba(201, 169, 97, 0.1);
    color: var(--gold);
    border-radius: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-family: 'Montserrat', 'Noto Sans Armenian', sans-serif;
  }

  /* ---------- ABOUT ---------- */
  #about {
    background: var(--dark);
    position: relative;
  }
  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5rem;
    max-width: 1200px;
    margin: 0 auto;
    align-items: center;
  }
  .about-image {
    position: relative;
    height: 500px;
    border-radius: 4px;
    overflow: hidden;
    background: url('https://images.unsplash.com/photo-1554118811-1e0d58224f24?w=800&q=80') center/cover;
  }
  .about-image::after {
    content: '';
    position: absolute;
    inset: 15px;
    border: 1px solid var(--gold);
    pointer-events: none;
  }
  .about-text h3 {
    font-family: 'Playfair Display', 'Noto Serif Armenian', serif;
    font-size: 2.5rem;
    margin-bottom: 1.5rem;
    color: var(--cream);
  }
  .about-text p {
    color: var(--muted);
    margin-bottom: 1.2rem;
    font-family: 'Cormorant Garamond', 'Noto Serif Armenian', serif;
    font-size: 1.15rem;
    line-height: 1.8;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2rem;
    margin-top: 3rem;
    padding-top: 2rem;
    border-top: 1px solid rgba(201, 169, 97, 0.2);
  }
  .stat-num {
    font-family: 'Playfair Display', 'Noto Serif Armenian', serif;
    font-size: 2.5rem;
    color: var(--gold);
    font-weight: 700;
  }
  .stat-label {
    font-size: 0.75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    font-family: 'Montserrat', 'Noto Sans Armenian', sans-serif;
  }

  /* ---------- RESERVATION ---------- */
  #reservation {
    background:
      linear-gradient(rgba(14,14,14,0.85), rgba(14,14,14,0.9)),
      url('https://images.unsplash.com/photo-1445116572660-236099ec97a0?w=1920&q=80') center/cover fixed;
    text-align: center;
  }
  .reservation-form {
    max-width: 700px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
  }
  .reservation-form input,
  .reservation-form select {
    padding: 1rem 1.2rem;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(201, 169, 97, 0.3);
    color: var(--cream);
    font-family: 'Montserrat', 'Noto Sans Armenian', sans-serif;
    font-size: 0.9rem;
    transition: all 0.3s;
  }
  .reservation-form input:focus,
  .reservation-form select:focus {
    outline: none;
    border-color: var(--gold);
    background: rgba(255,255,255,0.08);
  }
  .reservation-form input::placeholder { color: var(--muted); }
  .reservation-form .full { grid-column: 1 / -1; }
  .reservation-form button {
    grid-column: 1 / -1;
    padding: 1.2rem;
    background: var(--gold);
    color: var(--dark);
    border: none;
    cursor: pointer;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 600;
    font-size: 0.9rem;
    transition: all 0.3s;
    font-family: 'Montserrat', 'Noto Sans Armenian', sans-serif;
  }
  .reservation-form button:hover {
    background: var(--gold-light);
    letter-spacing: 5px;
  }

  /* ---------- FOOTER ---------- */
  footer {
    background: #080808;
    padding: 4rem 5% 2rem;
    text-align: center;
    border-top: 1px solid rgba(201, 169, 97, 0.15);
  }
  .footer-logo {
    font-family: 'Playfair Display', 'Noto Serif Armenian
