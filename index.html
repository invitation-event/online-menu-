<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CELAVI — Luxury Café & Bistro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700;900&family=Montserrat:wght@300;400;500;600&family=Noto+Sans+Armenian:wght@300;400;500;600&family=Noto+Serif+Armenian:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ... նախորդ կոդը պահված է ... */
  
  /* Նոր ոճեր նկարների և վիդեոների համար */
  .menu-item {
    position: relative;
    overflow: hidden;
  }
  .menu-item::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    transition: left 0.6s ease;
  }
  .menu-img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 4px;
    margin-bottom: 1.2rem;
    transition: transform 0.4s ease;
  }
  .menu-item:hover .menu-img {
    transform: scale(1.05);
  }
  .video-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
  }
  .video-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(rgba(14,14,14,0.7), rgba(14,14,14,0.9));
  }
</style>
</head>
<body>

<!-- Վիդեո ֆոն հերո բաժնում -->
<video class="video-background" autoplay muted loop>
  <source src="cafe-atmosphere.mp4" type="video/mp4">
</video>
<div class="video-overlay"></div>

<!-- Նախորդ կոդը պահված է ... -->

<!-- MENU -->
<section id="menu">
  <div class="section-header reveal">
    <div class="section-label" data-i18n="menu_label">Our Selection</div>
    <h2 class="section-title" data-i18n="menu_title">The Menu</h2>
    <div class="section-divider"></div>
    <p class="section-desc" data-i18n="menu_desc">Curated with passion, crafted with precision — a symphony of flavors awaits.</p>
  </div>

  <div class="menu-categories reveal">
    <!-- ... նախորդ կոդը պահված է ... -->
  </div>

  <div class="menu-grid" id="menuGrid">
    <!-- Կավե բաժին -->
    <div class="menu-item" data-cat="coffee">
      <img src="espresso.jpg" alt="Signature Espresso" class="menu-img">
      <div class="item-header">...</div>
      ...
    </div>
    <!-- Հրուշակեղեն բաժին -->
    <div class="menu-item" data-cat="pastry">
      <img src="pastry.jpg" alt="Butter Croissant" class="menu-img">
      <div class="item-header">...</div>
      ...
    </div>
    <!-- Նախաճաշ բաժին -->
    <div class="menu-item" data-cat="breakfast">
      <img src="breakfast.jpg" alt="Truffle Eggs Benedict" class="menu-img">
      <div class="item-header">...</div>
      ...
    </div>
    <!-- Ճաշ բաժին -->
    <div class="menu-item" data-cat="lunch">
      <img src="lunch.jpg" alt="Wagyu Burger" class="menu-img">
      <div class="item-header">...</div>
      ...
    </div>
    <!-- Աղանդեր բաժին -->
    <div class="menu-item" data-cat="dessert">
      <img src="dessert.jpg" alt="Valrhona Chocolate Soufflé" class="menu-img">
      <div class="item-header">...</div>
      ...
    </div>
  </div>
</section>

<!-- Վիդեո բաժին գովազդային նպատակով -->
<section class="video-section" style="position: relative; height: 70vh;">
  <video autoplay muted loop style="width: 100%; height: 100%; object-fit: cover;">
    <source src="crafting-process.mp4" type="video/mp4">
  </video>
  <div class="section-header" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white; z-index: 2;">
    <h2 data-i18n="video_title">The Art of Perfection</h2>
    <p data-i18n="video_desc">Witness our chefs' passion in every detail</p>
  </div>
</section>

<!-- Ոչ հարմար վիդեո ֆոն հերո բաժնում -->
<video class="video-background" autoplay muted loop style="display: none;">
  <source src="cafe-ambience.mp4" type="video/mp4">
</video>

<!-- Նախորդ կոդը պահված է ... -->
</body>
</html>
